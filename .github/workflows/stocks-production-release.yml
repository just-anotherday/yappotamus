name: Stocks production release gate

on:
  push:
    branches:
      - main
    paths:
      - "apps/stocks/backend/**"
      - "apps/stocks/alembic/**"
      - "apps/stocks/alembic.ini"
      - "apps/stocks/Dockerfile"
      - "apps/stocks/requirements.txt"
      - "apps/stocks/run.py"
      - ".github/workflows/stocks-production-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-stocks-release
  cancel-in-progress: false

jobs:
  migrate-production:
    name: Migrate production database
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: stocks-production

    steps:
      - name: Check out release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/stocks/requirements.txt

      - name: Install migration dependencies
        working-directory: apps/stocks
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Apply production migrations
        working-directory: apps/stocks
        env:
          DATABASE_URL: ${{ secrets.STOCKS_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          python -m alembic upgrade head

      - name: Verify production is at repository head
        working-directory: apps/stocks
        env:
          DATABASE_URL: ${{ secrets.STOCKS_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          python -m alembic current --check-heads
