<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A personal directory for boards, shopping lists, and cooking instructions." />
    <title>Project Directory ? yapvibes</title>
    <script>
      // Apply the saved theme before React starts to prevent a color flash.
      (function() {
        var stored;
        try { stored = localStorage.getItem('yapvibes:organizer:theme'); } catch (error) {}
        var theme = stored === 'light' || stored === 'dark' || stored === 'forest' || stored === 'midnight' || stored === 'sunset'
          ? stored
          : 'forest';
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle('dark', theme !== 'light');
        try {
          var savedAppearance = JSON.parse(localStorage.getItem('yapvibes:organizer:appearance'));
          var colors = savedAppearance && savedAppearance.colors;
          var keys = { pageBackground: '--app-background', headerBackground: '--header-background', contentBackground: '--content-background', sectionBackground: '--section-background', cardBackground: '--card-background', inputBackground: '--input-background', borderColor: '--border-color', primaryAccent: '--primary-accent', primaryText: '--text-primary', mutedText: '--text-muted' };
          if (colors) Object.keys(keys).forEach(function(key) { if (/^#[0-9a-f]{6}$/i.test(colors[key])) document.documentElement.style.setProperty(keys[key], colors[key]); });
          var overrides = savedAppearance && savedAppearance.sectionOverrides;
          if (overrides) ['projects', 'shopping', 'recipes'].forEach(function(key) { if (/^#[0-9a-f]{6}$/i.test(overrides[key])) document.documentElement.style.setProperty('--' + key + '-section-background', overrides[key]); });
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
